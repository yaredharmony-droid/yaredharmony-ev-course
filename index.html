<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yaredharmoney EV Course</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  body { margin:0; font-family:'Inter',sans-serif; background:#10151B; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const { useState, useEffect } = React;

const CODE_KEY = "yaredev_code";
const getSavedCode = () => { try { return localStorage.getItem(CODE_KEY) || ""; } catch (e) { return ""; } };
const saveCode = (c) => { try { localStorage.setItem(CODE_KEY, c); } catch (e) {} };
const clearCode = () => { try { localStorage.removeItem(CODE_KEY); localStorage.removeItem("yaredev_unlocked"); } catch (e) {} };

// Asks the server about a code and/or a lesson. The code, the video IDs and the
// lesson text all live on the server (api/play.js), not in this page.
async function askServer(payload) {
  try {
    const r = await fetch("/api/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    return { status: r.status, data };
  } catch (e) {
    return { status: 0, data: {} };
  }
}

const MODULES = [
  { id: "m1", title: "Why Electric Vehicles, Why Now", lessons: [
    { id: "l1b", title: "Introduction to EV and HEV", duration: "14 min", free: true },
    { id: "l1c", title: "Introduction to EV: MHEV and FCEV", duration: "13 min", free: true },
    { id: "l1", title: "The global shift to electric", duration: "12 min", free: true },
    { id: "l2", title: "EVs in the Ethiopian market", duration: "18 min", free: true },
    { id: "l3", title: "Cost of ownership vs. combustion", duration: "15 min", free: false },
  ]},
  { id: "m2", title: "EV Systems & Components", lessons: [
    { id: "l4", title: "Battery, motor, and inverter basics", duration: "20 min", free: false },
    { id: "l4a", title: "Introduction to Battery (Battery Types)", duration: "16 min", free: false },
    { id: "l4a1", title: "Introduction to Battery (Part 1)", duration: "16 min", free: false },
    { id: "l4a2", title: "Introduction to Battery (BMS)", duration: "16 min", free: false },
    { id: "l4a3", title: "Introduction to Battery (BMS 2)", duration: "16 min", free: false },
    { id: "l4thermal", title: "Thermal Management", duration: "15 min", free: false },
    { id: "l4b", title: "On-board charger and DC-DC converter", duration: "18 min", free: false },
    { id: "l4q", title: "Traction Motor", duration: "15 min", free: false },
    { id: "l4g", title: "Charging System", duration: "15 min", free: false },
    { id: "l4g2", title: "Charging System (Part 2)", duration: "15 min", free: false },
    { id: "l5", title: "Charging types explained", duration: "14 min", free: false },
    { id: "l6", title: "Range, efficiency, and climate effects", duration: "16 min", free: false },
  ]},
  { id: "m3", title: "Vehicle-Specific Diagnostics & Repair", lessons: [
    { id: "l4c", title: "DC-DC Converter and OBC: Changan E-Star", duration: "16 min", free: false },
    { id: "l4j", title: "Battery: Changan E-Star", duration: "17 min", free: false },
    { id: "l4f", title: "DC-DC Converter and OBC: Dongfeng", duration: "16 min", free: false },
    { id: "l4p", title: "Inverter and DC-DC: Peugeot", duration: "16 min", free: false },
    { id: "l4d", title: "Components of an EV: Neta", duration: "15 min", free: false },
    { id: "l4h", title: "Battery Assembly: Neta", duration: "17 min", free: false },
    { id: "l4i", title: "Battery Disassembly", duration: "17 min", free: false },
    { id: "l4e", title: "Components of an EV: BYD", duration: "15 min", free: false },
    { id: "l4k", title: "BYD Diagnosis", duration: "17 min", free: false },
    { id: "l4l", title: "BYD Yuan Up Diagnosis", duration: "17 min", free: false },
    { id: "l4m", title: "Chery iCar 3 Health Report", duration: "16 min", free: false },
    { id: "l4n", title: "Chery iCar 3 Trailer Mode", duration: "14 min", free: false },
    { id: "l4o", title: "Chery Service Reset", duration: "12 min", free: false },
  ]},
  { id: "m4", title: "Buying, Importing, and Owning", lessons: [
    { id: "l7", title: "Import rules and duties", duration: "19 min", free: false },
    { id: "l8", title: "Finding reliable charging access", duration: "13 min", free: false },
    { id: "l9", title: "Maintenance and battery health", duration: "17 min", free: false },
  ]},
];
const ALL_LESSONS = MODULES.flatMap((m) => m.lessons);

function Header({ setView, loggedIn }) {
  return (
    <header className="sticky top-0 z-20 bg-[#10151B]/95 backdrop-blur" style={{borderBottom:"1px solid #263140"}}>
      <div className="max-w-4xl mx-auto px-5 py-4 flex items-center justify-between">
        <button onClick={() => setView("landing")} className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{background:"#35E0A1"}}>
            <span style={{color:"#0B0F13", fontWeight:"bold"}}>⚡</span>
          </div>
          <span style={{fontFamily:"'Space Grotesk',sans-serif"}} className="text-[#EDEFF2] font-semibold text-[15px]">
            Yaredharmoney <span style={{color:"#35E0A1"}}>EV</span>
          </span>
        </button>
        {loggedIn ? (
          <button onClick={() => setView("dashboard")} className="text-sm text-[#8B95A1] hover:text-[#EDEFF2]">My course</button>
        ) : (
          <button onClick={() => setView("login")} className="text-sm px-4 py-1.5 rounded-md font-medium" style={{background:"#1B232C", color:"#EDEFF2", border:"1px solid #2B3644"}}>Unlock course</button>
        )}
      </div>
    </header>
  );
}

function CourseOutline({ selectedId, onSelect, unlocked }) {
  const [open, setOpen] = useState("m1");
  const canPlay = (l) => l.free || unlocked;
  return (
    <div className="space-y-2">
      {MODULES.map((mod, mi) => (
        <div key={mod.id} className="rounded-lg overflow-hidden" style={{border:"1px solid #1F2933", background:"#141B22"}}>
          <button onClick={() => setOpen(open === mod.id ? null : mod.id)} className="w-full flex items-center justify-between px-4 py-3.5">
            <div className="flex items-center gap-3 text-left">
              <span className="text-[#4B5563] text-[13px] font-medium">{mi+1}</span>
              <span className="text-[#EDEFF2] text-[14px] font-medium">{mod.title}</span>
            </div>
            <span style={{color:"#8B95A1"}}>{open === mod.id ? "▾" : "▸"}</span>
          </button>
          {open === mod.id && (
            <div style={{borderTop:"1px solid #1F2933"}}>
              {mod.lessons.map((l) => (
                <button key={l.id} disabled={!canPlay(l)} onClick={() => onSelect && onSelect(l)}
                  className="w-full flex items-center justify-between px-4 py-3 pl-11 text-left"
                  style={{borderTop:"1px solid #181F27", background: selectedId===l.id ? "#1A2530":"transparent", cursor: canPlay(l)?"pointer":"default"}}>
                  <div className="flex items-center gap-2.5">
                    <span style={{color: canPlay(l) ? "#35E0A1":"#4B5563"}}>{canPlay(l) ? "▶" : "🔒"}</span>
                    <span className="text-[13.5px]" style={{color: canPlay(l)?"#EDEFF2":"#8B95A1"}}>{l.title}</span>
                  </div>
                  <span className="text-[12px] text-[#4B5563]">{l.duration}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function Landing({ setView }) {
  return (
    <div className="max-w-4xl mx-auto px-5">
      <section className="pt-16 pb-14" style={{borderBottom:"1px solid #1F2933"}}>
        <p style={{color:"#35E0A1", fontFamily:"'Space Grotesk',sans-serif"}} className="text-[13px] font-medium mb-4">A practical EV course, built for Ethiopia</p>
        <h1 style={{fontFamily:"'Space Grotesk',sans-serif", lineHeight:1.08}} className="text-[38px] sm:text-[52px] font-semibold text-[#EDEFF2] max-w-2xl">
          Understand electric vehicles before you buy, import, or drive one.
        </h1>
        <p className="mt-5 text-[#8B95A1] text-[16px] max-w-lg leading-relaxed">
          Lessons on how EVs work, what they cost to own, and how to navigate charging and import realities where you live.
        </p>
        <div className="mt-8 flex items-center gap-4 flex-wrap">
          <button onClick={() => setView("checkout")} className="px-5 py-3 rounded-md font-medium text-[14px]" style={{background:"#35E0A1", color:"#0B0F13", fontFamily:"'Space Grotesk',sans-serif"}}>Enroll now →</button>
          <button onClick={() => setView("dashboard")} className="text-[14px] text-[#8B95A1] hover:text-[#EDEFF2]">Preview the first lesson</button>
        </div>
      </section>
      <section className="py-10" style={{borderTop:"1px solid #1F2933"}}>
        <h2 style={{fontFamily:"'Space Grotesk',sans-serif"}} className="text-[#EDEFF2] text-[20px] font-semibold mb-6">What's covered</h2>
        <CourseOutline unlocked={true} onSelect={() => setView("dashboard")} />
      </section>
    </div>
  );
}

function Login({ setView, setLoggedIn, setCode: saveToApp, notice }) {
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    const entered = code.trim();
    if (!entered || busy) return;
    setBusy(true);
    setError("");
    const { status } = await askServer({ code: entered });
    setBusy(false);
    if (status === 200) {
      saveCode(entered);
      saveToApp(entered);
      setLoggedIn(true);
      setView("dashboard");
    } else if (status === 401) {
      setError("That code doesn't look right. Check with your seller and try again.");
    } else {
      setError("Couldn't reach the server. Check your internet connection and try again.");
    }
  };
  return (
    <div className="max-w-sm mx-auto px-5 pt-20">
      <h1 style={{fontFamily:"'Space Grotesk',sans-serif"}} className="text-[#EDEFF2] text-[24px] font-semibold mb-1">Unlock your course</h1>
      <p className="text-[#8B95A1] text-[13.5px] mb-7">Enter the access code you received after payment.</p>
      {notice && <p className="text-[12.5px] mb-4" style={{color:"#F2B866"}}>{notice}</p>}
      <div className="space-y-3">
        <input
          value={code}
          onChange={(e) => setCode(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
          placeholder="Access code"
          className="w-full px-3.5 py-2.5 rounded-md text-[14px] outline-none"
          style={{background:"#161D25", border:"1px solid #263140", color:"#EDEFF2"}}
        />
        {error && <p className="text-[12.5px]" style={{color:"#F26666"}}>{error}</p>}
        <button onClick={submit} disabled={busy} className="w-full py-2.5 rounded-md font-medium text-[14px] mt-2" style={{background:"#35E0A1", color:"#0B0F13", fontFamily:"'Space Grotesk',sans-serif", opacity: busy ? 0.7 : 1}}>{busy ? "Checking..." : "Unlock course"}</button>
      </div>
      <p className="text-[12.5px] text-[#4B5563] mt-5 text-center">Haven't enrolled yet? <a href="#" onClick={(e) => { e.preventDefault(); setView("checkout"); }} style={{color:"#35E0A1"}}>Get access</a></p>
    </div>
  );
}

function Dashboard({ setView, unlocked, code, onBadCode }) {
  const [dataSaver, setDataSaver] = useState(true);
  const firstPlayable = ALL_LESSONS.find((l) => l.free) || ALL_LESSONS[0];
  const [current, setCurrent] = useState(firstPlayable);
  const [media, setMedia] = useState({ state: "idle" });
  const canPlayCurrent = current && (current.free || unlocked);

  useEffect(() => {
    if (!current || !canPlayCurrent) { setMedia({ state: "idle" }); return; }
    let cancelled = false;
    setMedia({ state: "loading" });
    askServer({ lessonId: current.id, code }).then(({ status, data }) => {
      if (cancelled) return;
      if (status === 200 && data.url) setMedia({ state: "video", url: data.url });
      else if (status === 200 && data.content) setMedia({ state: "text", content: data.content });
      else if (status === 200) setMedia({ state: "empty" });
      else if (status === 401) { setMedia({ state: "idle" }); onBadCode(); }
      else setMedia({ state: "error" });
    });
    return () => { cancelled = true; };
  }, [current && current.id, canPlayCurrent, code]);

  const embedSrc = media.state === "video" ? media.url : null;
  return (
    <div className="max-w-4xl mx-auto px-5 py-10">
      <div className="flex items-center justify-between mb-8">
        <h1 style={{fontFamily:"'Space Grotesk',sans-serif"}} className="text-[#EDEFF2] text-[24px] font-semibold">Your course</h1>
        <button onClick={() => setDataSaver(!dataSaver)} className="flex items-center gap-2 text-[13px] px-3 py-1.5 rounded-md" style={{background:"#1B232C", border:"1px solid #2B3644", color: dataSaver?"#35E0A1":"#8B95A1"}}>
          {dataSaver ? "📴" : "📶"} {dataSaver ? "Low-data mode on" : "Standard quality"}
        </button>
      </div>
      {!unlocked && (
        <div className="rounded-lg px-4 py-3 mb-6 flex items-center justify-between" style={{background:"#1B232C", border:"1px solid #2B3644"}}>
          <span className="text-[13px]" style={{color:"#C7CDD3"}}>You're viewing free preview lessons only.</span>
          <button onClick={() => setView("login")} className="text-[12.5px] font-medium px-3 py-1.5 rounded" style={{background:"#35E0A1", color:"#0B0F13"}}>Unlock</button>
        </div>
      )}
      <div className="rounded-xl overflow-hidden mb-8" style={{border:"1px solid #1F2933"}}>
        <div className="aspect-video relative" style={{background:"#0C1015"}}>
          {!canPlayCurrent ? (
            <div className="w-full h-full flex flex-col items-center justify-center gap-3 px-6 text-center">
              <span style={{fontSize:"28px"}}>🔒</span>
              <span className="text-[13px]" style={{color:"#8B95A1"}}>This lesson is part of the full course.</span>
              <button onClick={() => setView("checkout")} className="text-[12.5px] font-medium px-4 py-2 rounded-md" style={{background:"#35E0A1", color:"#0B0F13"}}>Get access</button>
            </div>
          ) : media.state === "loading" || media.state === "idle" ? (
            <div className="w-full h-full flex items-center justify-center">
              <span className="text-[12.5px]" style={{color:"#8B95A1"}}>Loading lesson...</span>
            </div>
          ) : media.state === "error" ? (
            <div className="w-full h-full flex flex-col items-center justify-center gap-2 px-6 text-center">
              <span className="text-[13px]" style={{color:"#F26666"}}>Couldn't load this lesson.</span>
              <span className="text-[12px]" style={{color:"#8B95A1"}}>Check your internet connection and tap the lesson again.</span>
            </div>
          ) : embedSrc ? (
            <iframe src={embedSrc} className="w-full h-full" style={{border:"none"}}
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture" allowFullScreen title={current ? current.title : "Lesson"} />
          ) : media.state === "text" ? (
            <div className="w-full h-full overflow-y-auto px-6 py-6">
              <span className="text-[11px] px-2 py-1 rounded inline-block mb-4" style={{background:"#1F2933", color:"#8B95A1"}}>📄 Reading lesson — video coming soon</span>
              <p className="text-[14px] leading-relaxed" style={{color:"#C7CDD3", whiteSpace:"pre-line"}}>{media.content}</p>
            </div>
          ) : (
            <div className="w-full h-full flex flex-col items-center justify-center gap-2">
              <span style={{fontSize:"32px"}}>▶</span>
              <span className="text-[11px] text-[#4B5563] px-4 text-center">No video for this lesson yet.</span>
            </div>
          )}
        </div>
        <div className="px-4 py-3 flex items-center justify-between" style={{background:"#141B22"}}>
          <span className="text-[13.5px] text-[#EDEFF2]">{current ? current.title : ""}</span>
          <span className="text-[12px] text-[#4B5563]">{current ? current.duration : ""}</span>
        </div>
      </div>
      <CourseOutline selectedId={current ? current.id : null} onSelect={setCurrent} unlocked={unlocked} />
    </div>
  );
}

function Checkout() {
  const [copied, setCopied] = useState("");
  const copy = (text, key) => {
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    setCopied(key);
    setTimeout(() => setCopied(""), 1500);
  };
  return (
    <div className="max-w-sm mx-auto px-5 pt-16 pb-16">
      <h1 style={{fontFamily:"'Space Grotesk',sans-serif"}} className="text-[#EDEFF2] text-[24px] font-semibold mb-1">Enroll in Yaredharmoney EV</h1>
      <p className="text-[#8B95A1] text-[13.5px] mb-7">Lifetime access, all lessons.</p>
      <div className="rounded-lg px-4 py-3 flex items-center justify-between mb-6" style={{background:"#141B22", border:"1px solid #1F2933"}}>
        <span className="text-[13.5px] text-[#EDEFF2]">Full course access</span>
        <span style={{fontFamily:"'Space Grotesk',sans-serif", color:"#35E0A1"}} className="font-semibold text-[16px]">3,999 Birr</span>
      </div>
      <p className="text-[12.5px] text-[#8B95A1] mb-2.5">Step 1 — Send payment to either account</p>
      <div className="space-y-2 mb-6">
        <button onClick={() => copy("0925279919", "telebirr")} className="w-full flex items-center justify-between px-3.5 py-3 rounded-md text-left" style={{background:"#161D25", border:"1px solid #263140"}}>
          <div>
            <div className="text-[13px] text-[#8B95A1]">Telebirr</div>
            <div className="text-[15px] text-[#EDEFF2] font-medium">0925279919</div>
          </div>
          <span className="text-[12px]" style={{color:"#35E0A1"}}>{copied === "telebirr" ? "Copied" : "Copy"}</span>
        </button>
        <button onClick={() => copy("1000525866223", "cbe")} className="w-full flex items-center justify-between px-3.5 py-3 rounded-md text-left" style={{background:"#161D25", border:"1px solid #263140"}}>
          <div>
            <div className="text-[13px] text-[#8B95A1]">CBE Birr</div>
            <div className="text-[15px] text-[#EDEFF2] font-medium">1000525866223</div>
          </div>
          <span className="text-[12px]" style={{color:"#35E0A1"}}>{copied === "cbe" ? "Copied" : "Copy"}</span>
        </button>
      </div>
      <p className="text-[12.5px] text-[#8B95A1] mb-2.5">Step 2 — Send your payment screenshot</p>
      <a href="https://t.me/yaredharmony" target="_blank" rel="noreferrer"
        className="w-full flex items-center justify-center gap-2 py-3 rounded-md font-medium text-[14px] mb-2"
        style={{background:"#35E0A1", color:"#0B0F13", fontFamily:"'Space Grotesk',sans-serif"}}>
        Send screenshot on Telegram (@yaredharmony)
      </a>
      <p className="text-[12px] text-[#4B5563] mt-4 text-center leading-relaxed">After we confirm your payment, you'll receive an access code by Telegram or email to unlock the full course — usually within a few hours.</p>
    </div>
  );
}

function App() {
  const [view, setView] = useState("landing");
  const [code, setCode] = useState(getSavedCode);
  const [loggedIn, setLoggedIn] = useState(() => getSavedCode() !== "");
  const [notice, setNotice] = useState("");
  // The server said the saved code is no longer valid: forget it and ask again.
  const onBadCode = () => {
    clearCode();
    setCode("");
    setLoggedIn(false);
    setNotice("Your access code is no longer valid. Enter your current code to continue.");
    setView("login");
  };
  return (
    <div style={{background:"#10151B", minHeight:"100vh"}}>
      <Header setView={setView} loggedIn={loggedIn} />
      {view === "landing" && <Landing setView={setView} />}
      {view === "login" && <Login setView={setView} setLoggedIn={setLoggedIn} setCode={setCode} notice={notice} />}
      {view === "dashboard" && <Dashboard setView={setView} unlocked={loggedIn} code={code} onBadCode={onBadCode} />}
      {view === "checkout" && <Checkout />}
      <div className="max-w-4xl mx-auto px-5 py-10 flex justify-center gap-6 text-[12px] text-[#4B5563]">
        <button onClick={() => setView("landing")}>Home</button>
        <button onClick={() => setView("dashboard")}>Course</button>
        <button onClick={() => setView("checkout")}>Enroll</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
